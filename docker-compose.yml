# Online Club — containers (API + web + persistent SQLite volume)
services:
  api:
    build:
      context: ./server
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_PATH: /data/online-club.db
      API_PUBLIC_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - club-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  club-data:
